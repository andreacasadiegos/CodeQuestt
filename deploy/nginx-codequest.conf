# CodeQuest · Nginx + PHP-FPM (ejemplo para /etc/nginx/sites-available/codequest)
#
# Estructura esperada en el VPS:
#   /var/www/codequest/            ← clon del repositorio (rama de despliegue)
#   /var/www/codequest/frontend/dist  ← resultado de `npm run build`
#
# Solo se publican dos cosas: los archivos estáticos de dist/ y el punto de
# entrada PHP backend/api/index.php. El resto del repositorio (config.php,
# database/, tests/, .git) NUNCA queda accesible desde la web.
#
# Cambia codequest.ejemplo.edu.co por tu dominio y ajusta la versión de PHP
# del socket (php8.2-fpm.sock, php8.3-fpm.sock…). Los certificados los crea
# Certbot: sudo certbot --nginx -d codequest.ejemplo.edu.co

server {
    listen 80;
    listen [::]:80;
    server_name codequest.ejemplo.edu.co;
    # Certbot agrega aquí la redirección a HTTPS.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codequest.ejemplo.edu.co;

    # ssl_certificate     /etc/letsencrypt/live/codequest.ejemplo.edu.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/codequest.ejemplo.edu.co/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/codequest/frontend/dist;
    index index.html;

    access_log /var/log/nginx/codequest.access.log;
    error_log  /var/log/nginx/codequest.error.log warn;

    client_max_body_size 1m;   # La API solo recibe JSON pequeño.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Limitación básica por IP para la API (la app además limita el login).
    # Ojo: en un colegio muchos estudiantes comparten la misma IP pública,
    # por eso el límite es generoso. Requiere en /etc/nginx/nginx.conf,
    # dentro de http { }:
    #   limit_req_zone $binary_remote_addr zone=codequest_api:10m rate=30r/s;

    # ---------- API PHP: /api/... → backend/api/index.php ----------
    location ^~ /api/ {
        # Descomenta tras definir la zona limit_req_zone (ver arriba):
        # limit_req zone=codequest_api burst=120 nodelay;
        # limit_req_status 429;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/codequest/backend/api/index.php;
        # El enrutador quita este prefijo de REQUEST_URI.
        fastcgi_param SCRIPT_NAME     /api/index.php;
        fastcgi_param HTTPS           on;
        fastcgi_pass unix:/run/php/php8.3-fpm-codequest.sock;
        fastcgi_read_timeout 60s;   # CodeBot espera hasta 35 s a Gemini.
    }

    # ---------- Recursos con hash de Vite: caché larga ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- Rutas de la SPA (/panel, /tutor…) → index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Nunca servir archivos ocultos (.git, .env…).
    location ~ /\. { deny all; }
}
