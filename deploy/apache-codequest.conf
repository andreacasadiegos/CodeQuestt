# CodeQuest · Apache 2.4 + PHP-FPM (ejemplo para /etc/apache2/sites-available/codequest.conf)
# Módulos: sudo a2enmod rewrite headers ssl proxy_fcgi setenvif
# HTTPS:   sudo certbot --apache -d codequest.ejemplo.edu.co

<VirtualHost *:80>
    ServerName codequest.ejemplo.edu.co
    Redirect permanent / https://codequest.ejemplo.edu.co/
</VirtualHost>

<VirtualHost *:443>
    ServerName codequest.ejemplo.edu.co
    DocumentRoot /var/www/codequest/frontend/dist

    # SSLEngine on
    # SSLCertificateFile    /etc/letsencrypt/live/codequest.ejemplo.edu.co/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/codequest.ejemplo.edu.co/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/codequest.error.log
    CustomLog ${APACHE_LOG_DIR}/codequest.access.log combined

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    # Solo la carpeta backend/api se publica bajo /api.
    Alias /api /var/www/codequest/backend/api
    <Directory /var/www/codequest/backend/api>
        AllowOverride All          # usa backend/api/.htaccess (todo a index.php)
        Require all granted
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm-codequest.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    <Directory /var/www/codequest/frontend/dist>
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>
</VirtualHost>
