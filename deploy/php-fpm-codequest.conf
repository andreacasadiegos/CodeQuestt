; CodeQuest · pool de PHP-FPM (ejemplo para /etc/php/8.3/fpm/pool.d/codequest.conf)
; Permisos (contiene secretos): sudo chown root:root codequest.conf && sudo chmod 600 codequest.conf
; Reiniciar: sudo systemctl restart php8.3-fpm

[codequest]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-codequest.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Errores al log, nunca en la respuesta.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/codequest-error.log
php_admin_flag[expose_php] = off
; No fijes aquí session.cookie_* con php_admin_value: bloquea
; session_set_cookie_params() y la cookie pierde SameSite (lo configura la app).

; ---------- Variables de entorno (secretos: NO se suben a Git) ----------
; PHP-FPM borra el entorno por defecto: hay que declararlas aquí.
; Base de datos: elige UNA de las dos.
env[DATABASE_URL] = "mysql://codequest:CAMBIA_ESTA_CONTRASEÑA@127.0.0.1:3306/codequest_db"
; env[DATABASE_URL] = "postgresql://codequest:CAMBIA_ESTA_CONTRASEÑA@127.0.0.1:5432/codequest"
; env[DB_SSLMODE] = "disable"        ; PostgreSQL local sin SSL (Supabase: require)
env[APP_ENV] = "production"
env[APP_TIMEZONE] = "America/Bogota"
env[SESSION_HANDLER] = "files"       ; "database" si hay varios servidores
env[SESSION_COOKIE_SECURE] = "1"     ; la cookie solo viaja por HTTPS
env[GEMINI_API_KEY] = "TU_CLAVE_DE_GEMINI"
env[GEMINI_MODEL] = "gemini-2.5-flash-lite"
; env[TRUST_PROXY] = "1"             ; solo si hay un balanceador delante de Nginx
